<!doctype html>
<meta charset="utf-8">
<title>OG tipo (plantilla)</title>
<!-- El <style> es solo para verla en el navegador: al renderizar se descarta -->
<style>
@font-face{font-family:Archivo;font-weight:500;src:url(../fonts/Archivo-Medium.ttf)}
@font-face{font-family:Archivo;font-weight:700;src:url(../fonts/Archivo-Bold.ttf)}
@font-face{font-family:ArchivoWide;src:url(../fonts/ArchivoWide-Black.ttf)}
@font-face{font-family:ArchivoCond;src:url(../fonts/ArchivoCond-Black.ttf)}
body{margin:0}div{box-sizing:border-box}
</style>
<div style="box-sizing:border-box;display:flex;position:relative;width:1200px;height:630px;overflow:hidden;background:{{color}};font-family:Archivo">
<div style="box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;position:absolute;left:64px;top:64px;width:690px;height:502px">
 <div style="box-sizing:border-box;display:flex;align-items:center"><div style="box-sizing:border-box;display:flex;width:76px;height:76px;background:#ffffff;border-radius:19px"><img src="{{logo}}" width="76" height="76"></div><div style="box-sizing:border-box;display:flex;margin-left:18px;font-family:ArchivoWide;font-size:42px;letter-spacing:-0.5px;color:#ffffff">comi.dolar</div></div>
 <div style="box-sizing:border-box;display:flex;flex-direction:column">
  <div style="box-sizing:border-box;display:flex"><div style="box-sizing:border-box;display:flex;border:3px solid #ffffff;border-radius:99px;padding:6px 24px;font-weight:700;font-size:30px;color:#ffffff">{{etiqueta}}</div></div>
  <div style="box-sizing:border-box;display:flex;margin-top:22px;font-family:ArchivoWide;font-size:72px;line-height:1;color:#ffffff">{{antetitulo}}</div>
  <div style="box-sizing:border-box;display:block;width:690px;font-family:ArchivoWide;font-size:{{tamano}}px;line-height:1.02;letter-spacing:-3px;color:#ffffff;text-wrap:balance">{{nombre}}</div>
 </div>
 <div style="box-sizing:border-box;display:flex;font-weight:500;font-size:34px;line-height:1.3;color:#ffffff;width:640px">{{bajada}}</div>
</div>
<div style="box-sizing:border-box;display:flex;flex-direction:column;position:absolute;left:806px;top:46px;width:348px;height:538px;border-radius:24px;background:#ffffff">
 <div style="box-sizing:border-box;display:flex;justify-content:center;align-items:center;width:348px;height:376px">{{icono}}</div>
 <div style="box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;width:348px;height:162px;border-top:4px dashed #c9c9c4;color:#141414">
  <div style="box-sizing:border-box;display:flex;font-family:ArchivoWide;font-size:32px">{{pie}}</div>
  <div style="box-sizing:border-box;display:flex;font-weight:500;font-size:27px;margin-top:8px">comidolar.com.ar</div>
 </div>
</div>
<div style="box-sizing:border-box;display:flex;position:absolute;left:784px;top:402px;width:44px;height:44px;border-radius:22px;background:{{color}}"></div><div style="box-sizing:border-box;display:flex;position:absolute;left:1132px;top:402px;width:44px;height:44px;border-radius:22px;background:{{color}}"></div></div>
